# Manually build and publish the portable EXE.
name: release

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run app:build

      - name: Checksum
        shell: pwsh
        run: |
          Get-Item 'dist-portable/*.exe' | ForEach-Object {
              $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File -Encoding ascii 'dist-portable/SHA256SUMS'

      - name: Publish prepared release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Commit $env:RELEASE_COMMIT
