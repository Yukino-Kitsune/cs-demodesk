# Manually build the portable EXE and attach it to the workflow run.
name: release

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - name: Refresh protobuf Rust dependency locks
        run: |
          cargo update -p prost
          cargo update --manifest-path vendor/demoparser/csgoproto/Cargo.toml -p prost
          cargo update --manifest-path vendor/demoparser/csgoproto/Cargo.toml -p prost-build

      - run: npm ci
      - run: npm run app:build

      - name: Checksum
        shell: pwsh
        run: |
          Get-Item 'dist-portable/*.exe' | ForEach-Object {
              $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File -Encoding ascii 'dist-portable/SHA256SUMS'

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: CS-DemoDesk-${{ github.run_number }}
          path: |
            dist-portable/*.exe
            dist-portable/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
